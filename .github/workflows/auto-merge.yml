name: Auto Merge SOP Pull Requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-Merge SOP PR
        id: merge_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo ">>> 正在自动审查与合并 PR #${PR_NUMBER}..."
          gh pr merge "${PR_NUMBER}" --repo "${{ github.repository }}" --squash --admin || \
          gh pr merge "${PR_NUMBER}" --repo "${{ github.repository }}" --auto --squash

      - name: Rebuild SOP Index & Static Assets
        if: steps.merge_step.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git pull origin main
          node scripts/update-index.js
          cp index.html public/index.html || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(ci): auto rebuild index after merging PR #${{ github.event.pull_request.number }}" && git push origin main)
