name: Auto Ingest SOP from Issues

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    if: contains(github.event.issue.title, 'SOP') || contains(github.event.issue.labels.*.name, 'auto-sop')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Parse and Ingest SOP from Issue
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          node scripts/ingest-from-issue.js
          cp index.html public/index.html

      - name: Commit and Push to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add library/ sops.json public/sops.json INDEX.md public/index.html
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "feat(auto-ingest): automatically ingest SOP from Issue #${{ github.event.issue.number }}"
            git push origin main
          fi

      - name: Comment and Close Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.issue.number;
            const comment = `🎉 **SOP 自动入库成功！**\n\n感谢 @${context.payload.issue.user.login} 的贡献！您的 SOP 资产已经由自动化机器人成功解析并合并入官方主库。\n\n- **在线知识库**: [https://dcn-autotest-team.github.io/sop/](https://dcn-autotest-team.github.io/sop/)\n- **资产索引**: [INDEX.md](https://github.com/dcn-autotest-team/sop/blob/main/INDEX.md)\n\n系统已自动为您归档并关闭此 Issue。`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });
